[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev -- --host 127.0.0.1"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/devscore"
  to = "/index.html"
  status = 200


[[redirects]]
  from = "/timesheet"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/devscore/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/timesheet/*"
  to = "/index.html"
  status = 200
